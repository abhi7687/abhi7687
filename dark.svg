<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1180"
    height="610"
    viewBox="0 0 1180 610"
    fill="none">

<defs>

    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="60%">
        <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18">
            <animate attributeName="stop-opacity"
                values="0.12;0.22;0.12"
                dur="8s"
                repeatCount="indefinite"/>
        </stop>
        <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bgGlow2" cx="80%" cy="80%" r="70%">
        <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16">
            <animate attributeName="stop-opacity"
                values="0.10;0.20;0.10"
                dur="10s"
                repeatCount="indefinite"/>
        </stop>
        <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

</defs>

<!-- Background -->

<rect width="1180" height="610" fill="#030712"/>
<rect width="1180" height="610" fill="url(#bgGlow1)"/>
<rect width="1180" height="610" fill="url(#bgGlow2)"/>

<!-- Main Panel -->

<rect
    x="20"
    y="20"
    width="1140"
    height="570"
    rx="28"
    fill="#0F172A"
    fill-opacity="0.72"/>

<rect
    x="20.5"
    y="20.5"
    width="1139"
    height="569"
    rx="28"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.08"/>

<!-- LEFT PANEL -->

<rect
    x="50"
    y="50"
    width="390"
    height="510"
    rx="24"
    fill="#111827"
    fill-opacity="0.72"/>

<rect
    x="50.5"
    y="50.5"
    width="389"
    height="509"
    rx="24"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.06"/>

<!-- RIGHT TERMINAL -->

<rect
    x="470"
    y="50"
    width="660"
    height="510"
    rx="24"
    fill="#111827"
    fill-opacity="0.72"/>

<rect
    x="470.5"
    y="50.5"
    width="659"
    height="509"
    rx="24"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.06"/>

<!-- Terminal Header -->

<rect
    x="470"
    y="50"
    width="660"
    height="48"
    rx="24"
    fill="#1F2937"/>

<rect
    x="470"
    y="74"
    width="660"
    height="24"
    fill="#1F2937"/>

<!-- Window Buttons -->

<circle
    cx="495"
    cy="74"
    r="6"
    fill="#FF5F56"/>

<circle
    cx="517"
    cy="74"
    r="6"
    fill="#FFBD2E"/>

<circle
    cx="539"
    cy="74"
    r="6"
    fill="#27C93F"/>

<!-- Terminal Title -->

<text
    x="800"
    y="79"
    text-anchor="middle"
    fill="#94A3B8"
    font-size="14"
    font-family="JetBrains Mono, Consolas, monospace">

terminal

</text>

<!-- Divider -->

<line
    x1="470"
    y1="98"
    x2="1130"
    y2="98"
    stroke="#FFFFFF"
    stroke-opacity="0.06"/>

</svg>
